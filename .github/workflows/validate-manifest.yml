name: validate-manifest

# Phase 1 step 6 of the schema policy: enforce the meta-schema in CI.
# Any PR that touches database-config.json or any meta-schema must pass
# `npm run validate:manifest` before merge.

on:
  push:
    branches: [main]
    paths:
      - 'database-config.json'
      - 'identity/schemas/meta/**'
      - 'identity/scripts/validate-manifest.ts'
      - 'connectivity/api/lib/meta-validator.ts'
  pull_request:
    paths:
      - 'database-config.json'
      - 'identity/schemas/meta/**'
      - 'identity/scripts/validate-manifest.ts'
      - 'connectivity/api/lib/meta-validator.ts'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate manifest against meta-schema
        run: npm run validate:manifest
