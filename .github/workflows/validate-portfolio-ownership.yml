name: validate-portfolio-ownership

# Gate PRs that touch the portfolio-owners / repo-requirements meta-schemas
# (or the validator itself) on `npm run validate:portfolio-ownership`.
#
# Validation runs against committed fixtures under
# identity/schemas/meta/fixtures/ — these are realistic, schema-exercising
# examples maintained inside this repo. The authoritative governance files
# live in CHITTYFOUNDATION/chittycanon/governance/{owners,repo_requirements}.json
# and are validated by chittycanon's own CI against this schema (via
# the meta-validate API at schema.chitty.cc/meta/:name/validate).

on:
  push:
    branches: [main]
    paths:
      - 'identity/schemas/meta/portfolio-owners.schema.json'
      - 'identity/schemas/meta/repo-requirements.schema.json'
      - 'identity/schemas/meta/fixtures/**'
      - 'identity/scripts/validate-portfolio-ownership.ts'
      - 'connectivity/api/lib/meta-validator.ts'
  pull_request:
    paths:
      - 'identity/schemas/meta/portfolio-owners.schema.json'
      - 'identity/schemas/meta/repo-requirements.schema.json'
      - 'identity/schemas/meta/fixtures/**'
      - 'identity/scripts/validate-portfolio-ownership.ts'
      - 'connectivity/api/lib/meta-validator.ts'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate portfolio ownership against meta-schemas
        env:
          CANON_DIR: identity/schemas/meta/fixtures
        run: npm run validate:portfolio-ownership
