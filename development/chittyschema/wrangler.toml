# Cloudflare Workers configuration for ChittySchema API
name = "chittyschema-api"
main = "api/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "0bc21e3a5a9de1a4cc843be9c3e98121"  # ChittyCorp LLC main account

# Production environment
[env.production]
name = "chittyschema-api"
routes = [
  { pattern = "schema.chitty.cc/*", zone_name = "chitty.cc" }
]

[env.production.vars]
ENVIRONMENT = "production"

# KV Namespace for Service Registry (Production)
[[env.production.kv_namespaces]]
binding = "REGISTRY_KV"
id = "c242ebbe796d4099b16c96dd687c0229"

# Optional: R2 bucket for badge caching and compliance reports
# [[env.production.r2_buckets]]
# binding = "REGISTRY_CACHE"
# bucket_name = "chittyschema-registry-cache"

# Optional: Analytics Engine for registry metrics
# [[env.production.analytics_engine_datasets]]
# binding = "REGISTRY_ANALYTICS"

# Staging environment
[env.staging]
name = "chittyschema-api-staging"
routes = [
  { pattern = "schema-staging.chitty.cc/*", zone_name = "chitty.cc" }
]

[env.staging.vars]
ENVIRONMENT = "staging"

# KV Namespace for Service Registry (Staging)
[[env.staging.kv_namespaces]]
binding = "REGISTRY_KV"
id = "619acafef9dc4310a61712521ea10edf"

# Development environment (local)
[env.development]
name = "chittyschema-api-dev"

[env.development.vars]
ENVIRONMENT = "development"

# KV Namespace for Service Registry (Development)
[[env.development.kv_namespaces]]
binding = "REGISTRY_KV"
preview_id = "10a3c500a2404906b4f8a6467dadca57"

# Build configuration
[build]
command = "npm run build:api"

# Observability
[observability]
enabled = true
